<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Catalogue - Mutuk Rentals Kinshasa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Metropolis:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script id="tailwind-config">
      tailwind.config = { theme: { extend: { colors: { "mutuk-blue": "#009ae0", "mutuk-dark": "#007bb5", "background": "#f8f9fa" }, fontFamily: { "display": ["Metropolis", "sans-serif"], "body": ["Hanken Grotesk", "sans-serif"] } } } }
    </script>
    <style>
        .material-symbols-outlined { vertical-align: middle; }
        .filter-btn.active { background-color: #009ae0; color: white; border-color: #009ae0; }
        .iti { width: 100%; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-background text-gray-900 font-body">

    <!-- HEADER -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-white shadow-sm h-16 md:h-20 border-b border-gray-100">
        <nav class="flex justify-between items-center h-full px-4 md:px-8 max-w-[1400px] mx-auto w-full">
            <a href="index.html" class="flex items-center gap-2 md:gap-3 h-10 md:h-12">
                <img src="image/logo.jpeg" alt="Mutuk Logo" class="h-full object-contain rounded-full border-2 border-mutuk-blue" onerror="this.src='https://placehold.co/100x100/009ae0/FFF?text=MR'">
                <span class="font-display text-lg md:text-2xl font-extrabold text-mutuk-dark">Mutuk<span class="text-mutuk-blue">Rentals</span></span>
            </a>
            <a href="index.html" class="text-gray-500 hover:text-mutuk-blue flex items-center gap-1 font-bold text-[13px] md:text-[15px]">
                <span class="material-symbols-outlined text-sm md:text-base">arrow_back</span> Retour
            </a>
        </nav>
    </header>

    <main class="pt-20 md:pt-32 pb-20 px-3 md:px-8 max-w-[1400px] mx-auto min-h-screen">
        <div class="mb-6 md:mb-8 flex flex-col md:flex-row md:items-end justify-between gap-3">
            <div>
                <h1 class="font-display text-2xl md:text-5xl font-extrabold text-gray-900 mb-1 md:mb-2">Notre Catalogue</h1>
                <p class="text-gray-500 text-xs md:text-base font-bold flex items-center gap-1"><span class="material-symbols-outlined text-yellow-500 text-sm md:text-base">stars</span> Service Chauffeur VIP inclus</p>
            </div>
            <div class="relative w-full md:w-auto md:min-w-[320px]">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg">search</span>
                <input type="text" id="catalog-search" oninput="handleCatalogSearch()" placeholder="Rechercher marque ou modèle..." class="w-full pl-9 pr-3 py-2 md:py-3 rounded-xl border border-gray-300 focus:outline-none focus:border-mutuk-blue text-xs md:text-sm font-bold text-gray-800">
            </div>
        </div>

        <!-- FILTRES (MIS À JOUR AVEC TOUTES LES CATÉGORIES) -->
        <div class="flex overflow-x-auto hide-scrollbar gap-2 mb-6 border-b border-gray-200 pb-4">
            <button onclick="filterCars('tout', this)" class="filter-btn active px-3 py-1.5 md:px-4 md:py-2 rounded-full border border-gray-300 font-bold text-xs md:text-sm text-gray-600 whitespace-nowrap">Tous</button>
            <button onclick="filterCars('suv', this)" class="filter-btn px-3 py-1.5 md:px-4 md:py-2 rounded-full border border-gray-300 font-bold text-xs md:text-sm text-gray-600 whitespace-nowrap">SUV 4x4</button>
            <button onclick="filterCars('suv_compact', this)" class="filter-btn px-3 py-1.5 md:px-4 md:py-2 rounded-full border border-gray-300 font-bold text-xs md:text-sm text-gray-600 whitespace-nowrap">SUV Compact</button>
            <button onclick="filterCars('berline', this)" class="filter-btn px-3 py-1.5 md:px-4 md:py-2 rounded-full border border-gray-300 font-bold text-xs md:text-sm text-gray-600 whitespace-nowrap">Berlines</button>
            <button onclick="filterCars('luxe', this)" class="filter-btn px-3 py-1.5 md:px-4 md:py-2 rounded-full border border-gray-300 font-bold text-xs md:text-sm text-gray-600 whitespace-nowrap">Luxe & VIP</button>
            <button onclick="filterCars('pickup', this)" class="filter-btn px-3 py-1.5 md:px-4 md:py-2 rounded-full border border-gray-300 font-bold text-xs md:text-sm text-gray-600 whitespace-nowrap">Pick-up</button>
            <button onclick="filterCars('economique', this)" class="filter-btn px-3 py-1.5 md:px-4 md:py-2 rounded-full border border-gray-300 font-bold text-xs md:text-sm text-gray-600 whitespace-nowrap">Économique</button>
            <button onclick="filterCars('hybride', this)" class="filter-btn px-3 py-1.5 md:px-4 md:py-2 rounded-full border border-gray-300 font-bold text-xs md:text-sm text-gray-600 whitespace-nowrap">Hybride</button>
            <button onclick="filterCars('utilitaire', this)" class="filter-btn px-3 py-1.5 md:px-4 md:py-2 rounded-full border border-gray-300 font-bold text-xs md:text-sm text-gray-600 whitespace-nowrap">Utilitaires</button>
        </div>

        <div id="search-indicator" class="hidden mb-4 p-3 bg-blue-50 text-mutuk-dark rounded-lg text-xs md:text-sm font-bold flex justify-between items-center">
            <span>Résultats pour : <span id="search-term" class="text-mutuk-blue"></span></span>
            <button onclick="clearSearch()" class="underline hover:text-mutuk-blue">Effacer</button>
        </div>

        <div id="loading-spinner" class="text-center py-16">
            <div class="animate-spin rounded-full h-10 w-10 border-b-4 border-mutuk-blue mx-auto mb-3"></div>
        </div>

        <div id="cars-grid" class="hidden grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2.5 sm:gap-4 md:gap-6"></div>
        
        <div id="no-results" class="hidden text-center py-16">
            <span class="material-symbols-outlined text-5xl text-gray-300 mb-2">search_off</span>
            <h3 class="text-base md:text-xl font-bold text-gray-600">Aucun véhicule trouvé</h3>
        </div>
    </main>

    <!-- MODAL DÉTAILS VOITURES -->
    <div id="car-details-modal" class="hidden fixed inset-0 bg-black/70 z-[100] flex items-center justify-center p-3 md:p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[92vh] overflow-y-auto relative">
            <button onclick="closeDetailsModal()" class="absolute top-3 right-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-full p-1.5 z-20"><span class="material-symbols-outlined text-lg">close</span></button>
            <div class="p-4 md:p-8">
                <div class="mb-4 md:mb-6">
                    <div class="h-48 sm:h-64 md:h-80 rounded-xl overflow-hidden bg-gray-100 mb-2 shadow-inner"><img id="detail-main-img" src="" class="w-full h-full object-cover"></div>
                    <div id="detail-thumbs" class="flex gap-2 overflow-x-auto pb-1"></div>
                </div>
                <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b pb-3 mb-4 gap-2">
                    <div>
                        <h2 id="detail-title" class="font-display text-xl md:text-3xl font-extrabold text-gray-900"></h2>
                        <span id="detail-category-badge" class="inline-block mt-1 text-[10px] md:text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 bg-blue-50 text-mutuk-blue rounded-full"></span>
                    </div>
                    <div>
                        <span id="detail-price" class="text-2xl md:text-3xl font-extrabold text-mutuk-blue block"></span>
                        <span class="text-[10px] md:text-xs text-gray-400 font-bold">par jour</span>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2 mb-4 bg-gray-50 p-3 rounded-xl border border-gray-100">
                    <div class="text-center">
                        <span class="material-symbols-outlined text-mutuk-blue text-xl mb-0.5">event_seat</span><span class="block text-[9px] md:text-xs font-bold text-gray-400 uppercase">Places</span><span id="detail-seats" class="font-extrabold text-gray-800 text-xs md:text-sm"></span>
                    </div>
                    <div class="text-center border-x border-gray-200">
                        <span class="material-symbols-outlined text-mutuk-blue text-xl mb-0.5">settings</span><span class="block text-[9px] md:text-xs font-bold text-gray-400 uppercase">Boîte</span><span id="detail-boite" class="font-extrabold text-gray-800 text-xs md:text-sm"></span>
                    </div>
                    <div class="text-center">
                        <span class="material-symbols-outlined text-mutuk-blue text-xl mb-0.5">local_gas_station</span><span class="block text-[9px] md:text-xs font-bold text-gray-400 uppercase">Carburant</span><span id="detail-fuel" class="font-extrabold text-gray-800 text-xs md:text-sm"></span>
                    </div>
                </div>
                <div class="mb-6">
                    <h4 class="font-bold text-gray-900 text-xs md:text-sm mb-1">Description & Options</h4>
                    <p id="detail-desc" class="text-gray-600 text-xs md:text-sm leading-relaxed"></p>
                </div>
                <button id="btn-reserver-details" class="w-full bg-mutuk-blue text-white font-bold py-3 md:py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-mutuk-dark transition shadow-md text-sm md:text-base">
                        <span class="material-symbols-outlined">event_available</span> Réserver
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL RÉSERVATION EXPRESS -->
    <div id="booking-modal" class="hidden fixed inset-0 bg-slate-950/70 backdrop-blur-md z-[150] flex items-center justify-center p-4 transition-all duration-300">
        <div class="bg-white rounded-3xl max-w-lg w-full p-5 md:p-8 relative shadow-2xl border border-slate-100 max-h-[95vh] overflow-y-auto">
            <button onclick="closeBookingModal()" class="absolute top-4 right-4 text-slate-400 hover:text-gray-800 transition-colors w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center"><span class="material-symbols-outlined text-xl">close</span></button>
            <span class="text-xs font-bold text-mutuk-blue uppercase tracking-widest">Réservation Express</span>
            <h3 class="font-display text-xl md:text-2xl uppercase text-gray-900 mb-4">RÉSERVER UN VÉHICULE</h3>
            
            <form onsubmit="handleBookingFormSubmit(event)" class="flex flex-col gap-3">
                <div>
                    <label class="text-xs font-semibold uppercase text-slate-600 flex items-center gap-1"><span class="material-symbols-outlined text-base">directions_car</span> Véhicule Sélectionné</label>
                    <input type="text" id="booking-car-name" readonly class="w-full p-2.5 bg-slate-50 rounded-xl font-semibold text-mutuk-blue border border-slate-200 text-sm mt-1 outline-none"/>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-semibold uppercase text-slate-600 flex items-center gap-1"><span class="material-symbols-outlined text-base">person</span> Nom Complet *</label>
                        <input required type="text" id="booking-client-name" placeholder="Votre nom" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-mutuk-blue/50 mt-1"/>
                    </div>
                    <div>
                        <label class="text-xs font-semibold uppercase text-slate-600 flex items-center gap-1"><span class="material-symbols-outlined text-base">call</span> Téléphone / WhatsApp *</label>
                        <div class="mt-1"><input required type="tel" id="booking-client-phone" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-mutuk-blue/50"/></div>
                    </div>
                </div>

                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <label class="text-xs font-semibold uppercase text-slate-600 flex items-center gap-1"><span class="material-symbols-outlined text-base text-mutuk-blue">flight_takeoff</span> Lieu de départ *</label>
                    <select id="booking-depart-type" onchange="toggleLocationInput('depart')" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm mt-1 outline-none bg-white">
                        <option value="agence">Agence Mutuk Rentals (Gombe)</option>
                        <option value="autre">Autre adresse...</option>
                    </select>
                    <textarea required id="booking-depart-address" rows="2" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm mt-2 bg-slate-100 text-slate-600 outline-none" readonly>5573. AV. KAUKA COMMUNE DE LA GOMBE&#10;REF: IMMEUBLE MAISHA PARK, ARRET : ROYAL</textarea>
                </div>
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <label class="text-xs font-semibold uppercase text-slate-600 flex items-center gap-1"><span class="material-symbols-outlined text-base text-mutuk-blue">flight_land</span> Lieu d'arrivée *</label>
                    <select id="booking-arrivee-type" onchange="toggleLocationInput('arrivee')" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm mt-1 outline-none bg-white">
                        <option value="agence">Agence Mutuk Rentals (Gombe)</option>
                        <option value="autre">Autre adresse...</option>
                    </select>
                    <textarea required id="booking-arrivee-address" rows="2" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm mt-2 bg-slate-100 text-slate-600 outline-none" readonly>5573. AV. KAUKA COMMUNE DE LA GOMBE&#10;REF: IMMEUBLE MAISHA PARK, ARRET : ROYAL</textarea>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="text-[10px] font-semibold uppercase text-slate-600 flex items-center gap-1"><span class="material-symbols-outlined text-sm">calendar_month</span> Date *</label>
                        <input type="date" id="booking-date" required class="w-full p-2.5 rounded-xl border border-slate-200 text-sm mt-1"/>
                    </div>
                    <div>
                        <label class="text-[10px] font-semibold uppercase text-slate-600 flex items-center gap-1"><span class="material-symbols-outlined text-sm">schedule</span> Heure *</label>
                        <input type="time" id="booking-time" value="08:00" required class="w-full p-2.5 rounded-xl border border-slate-200 text-sm mt-1"/>
                    </div>
                    <div>
                        <label class="text-[10px] font-semibold uppercase text-slate-600 flex items-center gap-1"><span class="material-symbols-outlined text-sm">hourglass_bottom</span> Durée (J) *</label>
                        <input type="number" id="booking-days" min="1" value="1" required class="w-full p-2.5 rounded-xl border border-slate-200 text-sm mt-1"/>
                    </div>
                </div>
                <button type="submit" class="mt-2 bg-mutuk-blue text-white font-semibold text-base py-3.5 rounded-xl shadow-lg shadow-mutuk-blue/25 hover:bg-mutuk-dark transition-all flex items-center justify-center gap-2 cursor-pointer">
                    Confirmer la demande
                </button>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT CATALOGUE -->
    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
