<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Mutuk Rentals</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Metropolis:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400&display=swap" rel="stylesheet">

    <!-- SUPABASE LIBRARY -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script id="tailwind-config">
      tailwind.config = {
        theme: {
          extend: {
            colors: { "mutuk-blue": "#009ae0", "mutuk-dark": "#007bb5", "background": "#f8f9fa" },
            fontFamily: { "display": ["Metropolis", "sans-serif"], "body": ["Hanken Grotesk", "sans-serif"] }
          }
        }
      }
    </script>
</head>
<body class="bg-background font-body min-h-screen">

    <!-- ECRAN DE CONNEXION (SANS BALISE FORM -> ZÉRO RAFRAÎCHISSEMENT POSSIBLE) -->
    <div id="login-screen" class="flex min-h-screen items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
            <div class="text-center mb-6">
                <img src="image/logo.jpeg" class="h-16 mx-auto rounded-full mb-3" onerror="this.src='https://placehold.co/100x100?text=MR'">
                <h1 class="font-display font-extrabold text-2xl text-gray-900">Espace Administration</h1>
                <p class="text-gray-500 text-sm">Connectez-vous avec vos identifiants Supabase</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Email</label>
                    <input type="email" id="login-email" class="w-full border p-3 rounded-lg outline-none focus:border-mutuk-blue text-gray-900" placeholder="votre-email@exemple.com" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Mot de passe</label>
                    <input type="password" id="login-password" onkeyup="if(event.key==='Enter') handleLoginManual()" class="w-full border p-3 rounded-lg outline-none focus:border-mutuk-blue text-gray-900" placeholder="••••••••" required>
                </div>
                
                <div id="login-error" class="text-red-500 text-xs font-bold hidden p-3 bg-red-50 rounded-lg text-center"></div>
                
                <button type="button" id="login-btn" onclick="handleLoginManual()" class="w-full bg-mutuk-blue text-white font-bold py-3 rounded-lg hover:bg-mutuk-dark transition cursor-pointer">
                    Se connecter
                </button>
            </div>

            <div class="text-center mt-6">
                <a href="index.html" class="text-sm text-gray-400 hover:underline">&larr; Retour au site public</a>
            </div>
        </div>
    </div>

    <!-- TABLEAU DE BORD ADMIN -->
    <div id="dashboard-screen" class="hidden min-h-screen flex flex-col">
        <!-- HEADER ADMIN -->
        <header class="bg-white border-b border-gray-200 h-16 flex items-center px-6 justify-between">
            <div class="flex items-center gap-3">
                <img src="image/logo.jpeg" class="h-10 rounded-full" onerror="this.src='https://placehold.co/100x100?text=MR'">
                <span class="font-display font-bold text-lg text-mutuk-dark">Mutuk Admin</span>
            </div>
            <div class="flex items-center gap-4">
                <span id="user-email" class="text-sm font-bold text-gray-600 hidden md:inline"></span>
                <a href="index.html" target="_blank" class="text-sm font-bold text-mutuk-blue hover:underline">Voir le site</a>
                <button type="button" onclick="handleLogout()" class="bg-red-50 text-red-500 text-sm font-bold px-3 py-1.5 rounded hover:bg-red-100">Déconnexion</button>
            </div>
        </header>

        <!-- CONTENU DASHBOARD -->
        <main class="flex-1 p-4 md:p-8 max-w-[1400px] mx-auto w-full">
            
            <!-- VUE LISTE -->
            <div id="list-view">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="font-display font-bold text-2xl text-gray-900">Gestion de la Flotte</h2>
                        <p class="text-gray-500 text-sm">Gérez les véhicules affichés sur le site</p>
                    </div>
                    <button type="button" onclick="showForm()" class="bg-mutuk-blue text-white px-4 py-2.5 rounded-lg font-bold flex items-center gap-2 hover:bg-mutuk-dark">
                        <span class="material-symbols-outlined">add</span> Ajouter un véhicule
                    </button>
                </div>

                <!-- TABLEAU DES VÉHICULES -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-gray-50 text-gray-500 font-bold uppercase border-b">
                                <tr>
                                    <th class="p-4">Photo</th>
                                    <th class="p-4">Marque & Modèle</th>
                                    <th class="p-4">Catégorie</th>
                                    <th class="p-4">Prix / Jour</th>
                                    <th class="p-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="admin-table-body" class="divide-y divide-gray-100">
                                <!-- Injecté par JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- VUE FORMULAIRE (AJOUT / MODIFICATION) -->
            <div id="form-view" class="hidden max-w-2xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-sm border border-gray-200">
                <div class="flex items-center gap-3 mb-6 pb-4 border-b">
                    <button type="button" onclick="showList()" class="text-gray-400 hover:text-mutuk-blue"><span class="material-symbols-outlined">arrow_back</span></button>
                    <h2 class="font-display font-bold text-2xl text-gray-900" id="form-title">Ajouter un véhicule</h2>
                </div>

                <form onsubmit="handleSaveCar(event)" class="space-y-4">
                    <input type="hidden" id="car-id">

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Marque</label>
                            <input type="text" id="car-brand" placeholder="ex: Toyota" class="w-full border p-3 rounded-lg outline-none focus:border-mutuk-blue" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Modèle</label>
                            <input type="text" id="car-model" placeholder="ex: Land Cruiser Prado" class="w-full border p-3 rounded-lg outline-none focus:border-mutuk-blue" required>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Catégorie</label>
                            <select id="car-category" class="w-full border p-3 rounded-lg outline-none focus:border-mutuk-blue">
                                <option value="suv">SUV 4x4</option>
                                <option value="berline">Berlines</option>
                                <option value="luxe">Luxe & VIP</option>
                                <option value="utilitaire">Utilitaires & Bus</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Prix (ex: 350$ ou Sur devis)</label>
                            <input type="text" id="car-price" placeholder="ex: 350$" class="w-full border p-3 rounded-lg outline-none focus:border-mutuk-blue" required>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Description / Tags</label>
                        <textarea id="car-desc" placeholder="ex: Blindé, 7 places..." class="w-full border p-3 rounded-lg outline-none focus:border-mutuk-blue" rows="3"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Photo du véhicule</label>
                        <input type="file" id="car-image" accept="image/*" class="w-full border p-2 rounded-lg text-sm bg-gray-50">
                        <img id="image-preview" class="mt-3 h-28 rounded object-cover border hidden">
                    </div>

                    <div class="flex justify-end gap-3 pt-4 border-t">
                        <button type="button" onclick="showList()" class="px-5 py-2.5 font-bold text-gray-500 hover:bg-gray-100 rounded-lg">Annuler</button>
                        <button type="submit" id="save-btn" class="px-6 py-2.5 font-bold bg-mutuk-blue text-white rounded-lg hover:bg-mutuk-dark transition">Enregistrer</button>
                    </div>
                </form>
            </div>

        </main>
    </div>

    <!-- JAVASCRIPT ADMIN ROBUSTE -->
    <script>
        const SUPABASE_URL = 'https://nuejepagywuozxdjymln.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51ZWplcGFneXd1b3p4ZGp5bWxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3OTUyMTksImV4cCI6MjEwMTM3MTIxOX0.NY5ubUi-2S9yMlpyFhAwCDMqUIywKJ9eiSho08mBB2k';
        
        let supabaseClient = null;
        let carsData = [];

        // Initialisation sécurisée du client
        function getSupabase() {
            if (!supabaseClient && window.supabase && window.supabase.createClient) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
            return supabaseClient;
        }

        // Vérification de la session au démarrage
        document.addEventListener('DOMContentLoaded', async () => {
            const client = getSupabase();
            if (client) {
                const { data: { session } } = await client.auth.getSession();
                if (session) {
                    showDashboard(session.user.email);
                }
            }
        });

        function showDashboard(email) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            document.getElementById('user-email').innerText = email;
            fetchAdminCars();
        }

        // CONNEXION SANS RAFRAÎCHISSEMENT POSSIBLE
        async function handleLoginManual() {
            const emailInput = document.getElementById('login-email');
            const passwordInput = document.getElementById('login-password');
            const errEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                errEl.innerText = "Veuillez remplir l'email et le mot de passe.";
                errEl.classList.remove('hidden');
                return;
            }

            const client = getSupabase();
            if (!client) {
                errEl.innerText = "Erreur: La connexion à Supabase n'est pas encore prête. Réessayez dans 2 secondes.";
                errEl.classList.remove('hidden');
                return;
            }

            btn.innerText = "Connexion en cours...";
            btn.disabled = true;
            errEl.classList.add('hidden');

            try {
                const { data, error } = await client.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    errEl.innerText = "Erreur: " + error.message;
                    errEl.classList.remove('hidden');
                    btn.innerText = "Se connecter";
                    btn.disabled = false;
                } else if (data && data.session) {
                    showDashboard(data.session.user.email);
                }
            } catch (catchErr) {
                console.error("Login Exception:", catchErr);
                errEl.innerText = "Une erreur s'est produite: " + catchErr.message;
                errEl.classList.remove('hidden');
                btn.innerText = "Se connecter";
                btn.disabled = false;
            }
        }

        // DECONNEXION
        async function handleLogout() {
            const client = getSupabase();
            if (client) await client.auth.signOut();
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('login-password').value = "";
        }

        // RECUPERER LES VOITURES
        async function fetchAdminCars() {
            const client = getSupabase();
            if (!client) return;

            const { data, error } = await client.from('cars').select('*').order('id', { ascending: false });
            if (error) {
                console.error("Error fetching cars:", error);
                return;
            }
            carsData = data || [];
            renderAdminTable();
        }

        // RENDU TABLEAU
        function renderAdminTable() {
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = "";

            carsData.forEach(car => {
                tbody.innerHTML += `
                <tr class="hover:bg-gray-50">
                    <td class="p-4"><img src="${car.image_url}" class="w-12 h-10 object-cover rounded border"></td>
                    <td class="p-4 font-bold text-gray-900">${car.marque} ${car.modele}</td>
                    <td class="p-4 uppercase text-xs font-bold text-gray-500">${car.categorie}</td>
                    <td class="p-4 font-bold text-mutuk-blue">${car.prix_jour}</td>
                    <td class="p-4 text-right">
                        <button type="button" onclick='editCar(${JSON.stringify(car).replace(/'/g, "\\'")})' class="p-2 text-mutuk-dark hover:bg-blue-50 rounded mr-1"><span class="material-symbols-outlined text-lg">edit</span></button>
                        <button type="button" onclick="deleteCar(${car.id})" class="p-2 text-red-500 hover:bg-red-50 rounded"><span class="material-symbols-outlined text-lg">delete</span></button>
                    </td>
                </tr>`;
            });
        }

        // FORMULAIRE ADMIN
        function showForm() {
            document.getElementById('list-view').classList.add('hidden');
            document.getElementById('form-view').classList.remove('hidden');
            document.getElementById('car-id').value = "";
            document.getElementById('car-brand').value = "";
            document.getElementById('car-model').value = "";
            document.getElementById('car-price').value = "";
            document.getElementById('car-desc').value = "";
            document.getElementById('car-image').value = "";
            document.getElementById('image-preview').classList.add('hidden');
            document.getElementById('form-title').innerText = "Ajouter un véhicule";
        }

        function showList() {
            document.getElementById('form-view').classList.add('hidden');
            document.getElementById('list-view').classList.remove('hidden');
        }

        function editCar(car) {
            showForm();
            document.getElementById('form-title').innerText = "Modifier le véhicule";
            document.getElementById('car-id').value = car.id;
            document.getElementById('car-brand').value = car.marque;
            document.getElementById('car-model').value = car.modele;
            document.getElementById('car-category').value = car.categorie;
            document.getElementById('car-price').value = car.prix_jour;
            document.getElementById('car-desc').value = car.description || "";
            
            const preview = document.getElementById('image-preview');
            preview.src = car.image_url;
            preview.classList.remove('hidden');
        }

        // ENREGISTRER (CREATE / UPDATE)
        async function handleSaveCar(e) {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            btn.innerText = "Sauvegarde en cours..."; btn.disabled = true;

            const client = getSupabase();
            const id = document.getElementById('car-id').value;
            const fileInput = document.getElementById('car-image');
            let imageUrl = id ? document.getElementById('image-preview').src : null;

            try {
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const fileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '')}`;
                    
                    const { error: uploadErr } = await client.storage.from('cars-images').upload(fileName, file);
                    if (uploadErr) throw uploadErr;

                    const { data } = client.storage.from('cars-images').getPublicUrl(fileName);
                    imageUrl = data.publicUrl;
                } else if (!id) {
                    throw new Error("Veuillez sélectionner une image pour le nouveau véhicule.");
                }

                const payload = {
                    marque: document.getElementById('car-brand').value,
                    modele: document.getElementById('car-model').value,
                    categorie: document.getElementById('car-category').value,
                    prix_jour: document.getElementById('car-price').value,
                    description: document.getElementById('car-desc').value,
                    image_url: imageUrl
                };

                if (id) payload.id = id;

                const { error: dbErr } = await client.from('cars').upsert([payload]);
                if (dbErr) throw dbErr;

                alert("Véhicule enregistré avec succès !");
                showList();
                fetchAdminCars();

            } catch (err) {
                alert("Erreur: " + err.message);
            } finally {
                btn.innerText = "Enregistrer"; btn.disabled = false;
            }
        }

        // SUPPRIMER
        async function deleteCar(id) {
            if (!confirm("Voulez-vous vraiment supprimer ce véhicule ?")) return;
            const client = getSupabase();
            const { error } = await client.from('cars').delete().eq('id', id);
            if (error) alert("Erreur lors de la suppression");
            else fetchAdminCars();
        }
    </script>
</body>
</html>
