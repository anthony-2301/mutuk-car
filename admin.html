<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Mutuk Rentals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Metropolis:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script id="tailwind-config">
      tailwind.config = { theme: { extend: { colors: { "mutuk-blue": "#009ae0", "mutuk-dark": "#007bb5", "mutuk-navy": "#0a192f", "background": "#f0f4f8" }, fontFamily: { "display": ["Metropolis", "sans-serif"], "body": ["Hanken Grotesk", "sans-serif"] } } } }
    </script>
    <style>
        .material-symbols-outlined { vertical-align: middle; }
    </style>
</head>
<body class="bg-background font-body min-h-screen">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="flex min-h-screen items-center justify-center p-4">
        <div class="bg-white p-8 md:p-10 rounded-3xl shadow-[0_10px_40px_rgba(0,154,224,0.1)] w-full max-w-md border border-gray-100 animate-[fadeInUp_0.5s_ease-out]">
            <div class="text-center mb-8">
                <img src="image/logo.jpeg" class="h-20 mx-auto rounded-full mb-4 border-2 border-mutuk-blue p-1 shadow-sm" onerror="this.src='https://placehold.co/100x100?text=MR'">
                <h1 class="font-display font-extrabold text-2xl text-gray-900 tracking-tight">Espace Administration</h1>
            </div>
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Email</label>
                    <input type="email" id="login-email" class="w-full border border-gray-200 p-3.5 rounded-xl outline-none focus:border-mutuk-blue focus:ring-4 focus:ring-mutuk-blue/10 text-gray-900 font-medium transition-all" placeholder="admin@mutukrentals.com" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Mot de passe</label>
                    <input type="password" id="login-password" onkeyup="if(event.key==='Enter') handleLoginManual()" class="w-full border border-gray-200 p-3.5 rounded-xl outline-none focus:border-mutuk-blue focus:ring-4 focus:ring-mutuk-blue/10 text-gray-900 font-medium transition-all" placeholder="••••••••" required>
                </div>
                <div id="login-error" class="text-red-500 text-xs font-bold hidden p-4 bg-red-50 border border-red-100 rounded-xl text-center"></div>
                
                <button type="button" id="login-btn" onclick="handleLoginManual()" class="w-full bg-mutuk-blue text-white font-bold py-4 rounded-xl hover:bg-mutuk-dark transition-all shadow-lg shadow-mutuk-blue/30 mt-2">
                    Se connecter
                </button>
            </div>
            <div class="text-center mt-8 pt-6 border-t border-gray-100">
                <a href="index.html" class="text-sm font-bold text-gray-400 hover:text-mutuk-blue transition-colors flex items-center justify-center gap-1">
                    <span class="material-symbols-outlined text-base">arrow_back</span> Retour au site public
                </a>
            </div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-screen" class="hidden min-h-screen flex flex-col">
        <!-- HEADER ADMIN (Glassmorphism) -->
        <header class="sticky top-0 z-40 bg-white/85 backdrop-blur-md border-b border-gray-200 h-16 md:h-20 flex items-center px-6 justify-between shadow-sm transition-all">
            <div class="flex items-center gap-3">
                <img src="image/logo.jpeg" class="h-10 md:h-12 rounded-full border border-gray-200" onerror="this.src='https://placehold.co/100x100?text=MR'">
                <span class="font-display font-bold text-lg md:text-xl text-mutuk-dark">Mutuk Admin</span>
            </div>
            <div class="flex items-center gap-4">
                <span id="user-email" class="text-sm font-bold text-gray-500 hidden md:inline px-3 py-1 bg-gray-50 rounded-lg border border-gray-100"></span>
                <a href="index.html" target="_blank" class="text-sm font-bold text-mutuk-blue hover:text-mutuk-dark transition-colors hidden sm:inline">Voir le site</a>
                <button type="button" onclick="handleLogout()" class="bg-red-50 text-red-500 border border-red-100 text-sm font-bold px-4 py-2 rounded-lg hover:bg-red-500 hover:text-white transition-colors flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">logout</span> Déconnexion
                </button>
            </div>
        </header>

        <main class="flex-1 p-4 md:p-8 max-w-[1400px] mx-auto w-full">
            <!-- VUE LISTE -->
            <div id="list-view" class="animate-[fadeInUp_0.3s_ease-out]">
                <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
                    <div>
                        <h2 class="font-display font-extrabold text-2xl md:text-3xl text-gray-900 tracking-tight">Gestion de la Flotte</h2>
                        <p class="text-mutuk-blue font-bold text-sm mt-1">Gérez vos véhicules et photos</p>
                    </div>
                    <button type="button" onclick="showForm()" class="bg-mutuk-blue text-white px-5 py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-mutuk-dark transition-all shadow-md w-full md:w-auto">
                        <span class="material-symbols-outlined">add</span> Ajouter un véhicule
                    </button>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-gray-50 text-gray-500 font-bold uppercase text-[10px] tracking-wider border-b border-gray-200">
                                <tr>
                                    <th class="p-4 md:p-5">Photo</th>
                                    <th class="p-4 md:p-5">Marque & Modèle</th>
                                    <th class="p-4 md:p-5">Catégorie</th>
                                    <th class="p-4 md:p-5">Prix Jour / Aéroport</th>
                                    <th class="p-4 md:p-5 text-center">À la une</th>
                                    <th class="p-4 md:p-5 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="admin-table-body" class="divide-y divide-gray-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- VUE FORMULAIRE COMPLET -->
            <div id="form-view" class="hidden max-w-3xl mx-auto bg-white p-6 md:p-10 rounded-3xl shadow-lg border border-gray-200 animate-[fadeInUp_0.3s_ease-out]">
                <div class="flex items-center justify-between mb-8 pb-4 border-b border-gray-100">
                    <div class="flex items-center gap-4">
                        <button type="button" onclick="showList()" class="text-gray-400 hover:text-mutuk-blue bg-gray-50 hover:bg-blue-50 p-2 rounded-full transition-colors"><span class="material-symbols-outlined">arrow_back</span></button>
                        <h2 class="font-display font-extrabold text-2xl text-gray-900 tracking-tight" id="form-title">Ajouter un véhicule</h2>
                    </div>
                    <div class="flex items-center gap-2 bg-yellow-50 px-4 py-2.5 rounded-xl border border-yellow-100 transition-colors hover:bg-yellow-100">
                        <input type="checkbox" id="car-featured" class="w-4 h-4 text-mutuk-blue rounded border-gray-300">
                        <label for="car-featured" class="text-xs font-bold text-yellow-700 cursor-pointer">À la une (Accueil)</label>
                    </div>
                </div>

                <form onsubmit="handleSaveCar(event)" class="space-y-6">
                    <input type="hidden" id="car-id">

                    <div class="grid grid-cols-2 gap-4 md:gap-6">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Marque</label>
                            <input type="text" id="car-brand" class="w-full border border-gray-200 p-3 rounded-xl outline-none focus:border-mutuk-blue focus:ring-2 focus:ring-mutuk-blue/20 transition-all font-medium" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Modèle</label>
                            <input type="text" id="car-model" class="w-full border border-gray-200 p-3 rounded-xl outline-none focus:border-mutuk-blue focus:ring-2 focus:ring-mutuk-blue/20 transition-all font-medium" required>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Catégorie</label>
                        <select id="car-category" class="w-full border border-gray-200 p-3 rounded-xl outline-none focus:border-mutuk-blue focus:ring-2 focus:ring-mutuk-blue/20 transition-all font-medium cursor-pointer">
                            <option value="suv">SUV 4x4</option>
                            <option value="suv_compact">SUV Compact</option>
                            <option value="berline">Berlines</option>
                            <option value="luxe">Luxe & VIP</option>
                            <option value="pickup">Pick-up</option>
                            <option value="economique">Économique</option>
                            <option value="hybride">Hybride</option>
                            <option value="utilitaire">Utilitaires & Bus</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 bg-blue-50/50 p-5 rounded-2xl border border-blue-100">
                        <div>
                            <label class="block text-xs font-bold text-mutuk-dark uppercase mb-2">Prix par jour ($)</label>
                            <input type="text" id="car-price" placeholder="ex: 150$" class="w-full border border-white p-3 rounded-xl outline-none focus:border-mutuk-blue focus:ring-2 focus:ring-mutuk-blue/20 font-bold text-mutuk-blue shadow-sm" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-mutuk-dark uppercase mb-2">Prix Transfert Aéroport ($)</label>
                            <input type="text" id="car-price-aero" placeholder="ex: 80$" class="w-full border border-white p-3 rounded-xl outline-none focus:border-mutuk-blue focus:ring-2 focus:ring-mutuk-blue/20 font-bold text-mutuk-blue shadow-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 bg-background p-5 rounded-2xl border border-gray-100">
                        <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-2">Places</label><input type="number" id="car-seats" value="5" min="1" max="50" class="w-full border border-gray-200 p-2.5 rounded-lg outline-none focus:border-mutuk-blue font-medium" required></div>
                        <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-2">Boîte</label><select id="car-boite" class="w-full border border-gray-200 p-2.5 rounded-lg outline-none focus:border-mutuk-blue font-medium"><option value="Automatique">Automatique</option><option value="Manuelle">Manuelle</option></select></div>
                        <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-2">Carburant</label><select id="car-fuel" class="w-full border border-gray-200 p-2.5 rounded-lg outline-none focus:border-mutuk-blue font-medium"><option value="Essence">Essence</option><option value="Diesel">Diesel</option><option value="Hybride">Hybride</option><option value="Électrique">Électrique</option></select></div>
                        <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-2">Climatisation</label><select id="car-clim" class="w-full border border-gray-200 p-2.5 rounded-lg outline-none focus:border-mutuk-blue font-medium"><option value="Oui">Oui</option><option value="Non">Non</option></select></div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Description / Options VIP</label>
                        <textarea id="car-desc" class="w-full border border-gray-200 p-4 rounded-xl outline-none focus:border-mutuk-blue focus:ring-2 focus:ring-mutuk-blue/20 transition-all font-medium leading-relaxed" rows="3" placeholder="Ex: Intérieur cuir, toit ouvrant, vitres teintées..."></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Photos (Jusqu'à 10 photos)</label>
                        <input type="file" id="car-images" accept="image/*" multiple class="w-full border border-gray-200 p-3 rounded-xl text-sm bg-gray-50 font-medium cursor-pointer file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-mutuk-blue file:text-white hover:file:bg-mutuk-dark transition-all">
                        <div id="previews-container" class="flex gap-3 mt-4 overflow-x-auto pb-2 hide-scrollbar"></div>
                    </div>

                    <div class="flex flex-col-reverse sm:flex-row justify-end gap-3 pt-6 border-t border-gray-100">
                        <button type="button" onclick="showList()" class="px-6 py-3.5 font-bold text-gray-500 hover:text-gray-800 hover:bg-gray-100 rounded-xl transition-colors text-center w-full sm:w-auto">Annuler</button>
                        <button type="submit" id="save-btn" class="px-8 py-3.5 font-bold bg-mutuk-blue text-white rounded-xl hover:bg-mutuk-dark transition-all shadow-lg shadow-mutuk-blue/30 text-center w-full sm:w-auto">Enregistrer le véhicule</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- APPEL PROPRE AUX FICHIERS JS -->
    <script src="js/supabase.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
